# Calls the backend's /health route, which queries Qdrant.
# Free Qdrant Cloud clusters are suspended when idle (and later deleted), which broke the
# live site once; this keeps the cluster active. If the check fails, the run fails and
# GitHub emails the repository owner.
name: Keep Qdrant alive

on:
  schedule:
    # Twice a day at 03:17 and 15:17 UTC (08:47 / 20:47 IST). An odd minute is used because
    # GitHub delays scheduled runs most at the top of the hour.
    - cron: "17 3,15 * * *"
  workflow_dispatch:          # allows running it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /health (retries while Render wakes up)
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o response.json -w "%{http_code}" --max-time 90 \
              https://enterprise-rag-assistant-6n3h.onrender.com/api/v1/health || true)
            echo "Attempt $attempt: HTTP $code $(cat response.json 2>/dev/null)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::Backend or Qdrant is not healthy. Check the Qdrant Cloud dashboard (cluster may be suspended)."
          exit 1
